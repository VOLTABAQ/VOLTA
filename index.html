<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volta</title>
<meta name="theme-color" content="#1E1E1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Volta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin:0; height:100%; background:#1E1E1E; overflow:hidden; }
  iframe {
    position:fixed; inset:0; width:100%; height:100%; border:0;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    box-sizing:border-box; background:#1E1E1E;
  }
  #msg {
    display:none; position:fixed; inset:0; padding:32px; color:#F0EBE2;
    font-family:system-ui,sans-serif; line-height:1.5; align-items:center;
    justify-content:center; text-align:center;
  }
  #cargando {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#1E1E1E; transition:opacity .3s;
  }
  #cargando img { width:96px; height:96px; }
</style>
</head>
<body>
<div id="cargando"><img src="icons/icon-192.png" alt="Volta"></div>
<div id="msg"></div>
<iframe id="app" title="Volta"
  allow="geolocation; camera; microphone; clipboard-write"></iframe>

<script>
  // ▼▼ PEGA AQUÍ la URL de tu web app (termina en /exec) ▼▼
  var URL_APP = 'PEGA_AQUI_LA_URL_EXEC';
  // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

  var frame = document.getElementById('app');
  if (URL_APP.indexOf('script.google.com') === -1) {
    var m = document.getElementById('msg');
    m.style.display = 'flex';
    m.textContent = 'Falta configurar la URL de la web app en index.html (variable URL_APP).';
    document.getElementById('cargando').style.display = 'none';
  } else {
    frame.src = URL_APP;
    frame.onload = function () {
      var c = document.getElementById('cargando');
      c.style.opacity = 0;
      setTimeout(function () { c.style.display = 'none'; }, 300);
    };
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
