<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volta — Menú & Pedidos en línea</title>
<meta name="description" content="Pizzas artesanales, masa madre y los mejores ingredientes en Barranquilla. ¡Pide en línea aquí!">
<meta name="theme-color" content="#1E1E1E">

<!-- Open Graph / WhatsApp / Instagram preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Volta — Menú & Pedidos en línea">
<meta property="og:description" content="Pizzas artesanales, masa madre y los mejores ingredientes en Barranquilla. ¡Pide en línea aquí!">
<meta property="og:image" content="../icons/icon-512.png">

<!-- Favicon & PWA -->
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Volta Pizza">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #1E1E1E;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
    background: #1E1E1E;
  }
  #cargando {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1E1E1E;
    color: #F0EBE2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: opacity .3s ease;
    z-index: 10;
  }
  #cargando img {
    width: 96px;
    height: 96px;
    margin-bottom: 16px;
    border-radius: 18px;
    animation: pulse 1.8s infinite ease-in-out;
  }
  #cargando p {
    font-size: 14px;
    opacity: 0.8;
    margin: 0;
    letter-spacing: 0.5px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.94); opacity: 0.75; }
  }
</style>
</head>
<body>
<div id="cargando">
  <img src="../icons/icon-192.png" alt="Volta">
  <p>Cargando el menú...</p>
</div>

<iframe id="menu-frame" title="Volta - Menú"
  src="https://script.google.com/macros/s/AKfycbxoTT4v6RP2Ze3KPufSwXhgLMVLwJKi6V06EbY_njkkjsfjQq9CtwlcTMBHc_6yJ-zNMg/exec?page=menu"
  allow="geolocation; camera; clipboard-write"></iframe>

<script>
  var frame = document.getElementById('menu-frame');
  frame.onload = function() {
    var c = document.getElementById('cargando');
    if (c) {
      c.style.opacity = '0';
      setTimeout(function() { c.style.display = 'none'; }, 300);
    }
  };
</script>
</body>
</html>
